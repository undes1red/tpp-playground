[project]
name = "tpp-playground"
version = "1.0.0"
description = "Main coderepo of MTPP models."
readme = "README.md"
requires-python = "==3.12.*"

[dependency-groups]
base = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "einops",
    "scipy",
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "termcolor",
    "transformers[torch]",
    "accelerate",
    "tabulate",
    "datasets",
    "termcolor",
    "submitit",
    "accelerate"
]

optional = [
    "wandb",
]

llm = [
    "openai",
    "vllm==0.11.0",
    "flashinfer-python",
    "ninja"
]

dev = [
    "ipython"
]

# Settings for uv
[tool.uv]
# Something we need during development while not when release.
default-groups = ["base", "optional", "llm", "dev"]
no-build-isolation-package = ["gptqmodel"]

# Install pytorch from the official pytorch repo.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true